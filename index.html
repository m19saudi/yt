<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <!-- Viewport locked to desktop width so Android desktop mode renders full desktop UI -->
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <title>StreamSlate — Desktop YouTube Client</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        slateDeep: '#0B0F19',
                        slateCard: '#0F172A',
                        slateElevated: '#1E293B',
                        cyberCyan: '#06B6D4',
                        cyberTeal: '#14B8A6',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0B0F19;
            color: #F8FAFC;
            overflow-x: auto;
            min-width: 1200px;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0F19;
        }
        ::-webkit-scrollbar-thumb {
            background: #1E293B;
            border-radius: 9999px;
            border: 2px solid #0B0F19;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
        .glass-header {
            background: rgba(11, 15, 25, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.12);
        }
        .sidebar-item {
            transition: all 0.15s ease;
        }
        .sidebar-item:hover {
            background: rgba(30, 41, 59, 0.7);
        }
        .sidebar-item.active {
            background: rgba(6, 182, 212, 0.15);
            color: #22d3ee;
            border-right: 3px solid #06B6D4;
        }
        .player-aspect {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
        }
        .player-aspect iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-cyan-500/30 selection:text-cyan-200">

    <!-- Toast Notification Container (Replaces alert()) -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full"></div>

    <!-- Top Desktop YouTube Header -->
    <header class="glass-header sticky top-0 z-50 w-full h-14 px-4 flex items-center justify-between gap-4">
        
        <!-- Left: Hamburger & Logo -->
        <div class="flex items-center gap-4 shrink-0">
            <button onclick="toggleSidebar()" class="p-2 rounded-xl text-slate-300 hover:bg-slate-800 transition-colors" title="Toggle Sidebar">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M3 12h18M3 6h18M3 18h18"/>
                </svg>
            </button>
            <button onclick="navigateHome()" class="flex items-center gap-2.5 group focus:outline-none">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-cyan-500 to-teal-500 flex items-center justify-center shadow-md shadow-cyan-500/20 group-hover:scale-105 transition-transform">
                    <svg class="w-4 h-4 text-slate-950 fill-current" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="font-bold text-base tracking-tight bg-gradient-to-r from-white via-slate-200 to-cyan-300 bg-clip-text text-transparent">StreamSlate</span>
                    <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">Desktop</span>
                </div>
            </button>
        </div>

        <!-- Center: Search & Direct URL Input Form -->
        <form id="search-form" class="flex-1 max-w-2xl flex items-center">
            <div class="relative w-full flex items-center">
                <div class="absolute left-3.5 text-slate-400 pointer-events-none">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
                    </svg>
                </div>
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Search YouTube or paste any youtube.com / youtu.be link..." 
                    autocomplete="off"
                    class="w-full bg-slate-900/95 text-slate-100 placeholder-slate-400 text-sm rounded-l-full pl-10 pr-9 py-2 border border-slate-700/80 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 focus:outline-none transition-all"
                >
                <button 
                    type="button" 
                    id="clear-search-btn" 
                    onclick="clearSearchInput()"
                    class="hidden absolute right-2 text-slate-400 hover:text-slate-200 p-1"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <button 
                type="submit" 
                class="bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-cyan-400 text-sm px-6 py-2 rounded-r-full border-t border-r border-b border-slate-700/80 transition-all flex items-center justify-center shrink-0"
                title="Search"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
                </svg>
            </button>
        </form>

        <!-- Right: Actions & Settings -->
        <div class="flex items-center gap-2 shrink-0">
            <button 
                onclick="toggleModal('settings-modal', true)"
                title="API & Settings"
                class="p-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-cyan-400 border border-slate-700/70 transition-all flex items-center gap-1.5 text-xs font-medium px-3"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                <span>Settings</span>
            </button>
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 to-teal-400 flex items-center justify-center font-bold text-slate-950 text-xs shadow-inner">
                DS
            </div>
        </div>
    </header>

    <!-- Main Desktop Workspace (Sidebar + Content) -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Left Desktop Sidebar -->
        <aside id="desktop-sidebar" class="w-64 glass-header flex flex-col shrink-0 overflow-y-auto select-none border-r border-slate-800/80 p-3 space-y-1">
            <div class="space-y-1 pb-3 border-b border-slate-800/80">
                <button onclick="switchTab('explore'); selectCategory('All')" id="sidebar-home" class="sidebar-item active w-full flex items-center gap-4 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-left">
                    <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span>Home</span>
                </button>
                <button onclick="switchTab('explore'); selectCategory('Coding & CS')" class="sidebar-item w-full flex items-center gap-4 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white text-left">
                    <svg class="w-4 h-4 text-teal-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    <span>Coding & CS</span>
                </button>
                <button onclick="switchTab('explore'); selectCategory('Ambient Focus')" class="sidebar-item w-full flex items-center gap-4 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white text-left">
                    <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    <span>Ambient Focus</span>
                </button>
                <button onclick="switchTab('explore'); selectCategory('Science & Space')" class="sidebar-item w-full flex items-center gap-4 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white text-left">
                    <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                    <span>Science & Space</span>
                </button>
            </div>

            <!-- Library & Playlists Section -->
            <div class="pt-3 pb-3 border-b border-slate-800/80 space-y-1">
                <div class="px-3.5 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-400">Library & Saved</div>
                <button onclick="switchTab('library')" id="sidebar-library" class="sidebar-item w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white text-left">
                    <div class="flex items-center gap-4">
                        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
                        <span>Watch Later</span>
                    </div>
                    <span id="saved-count-sidebar" class="bg-slate-800 text-cyan-400 font-mono text-[11px] px-1.5 py-0.2 rounded">0</span>
                </button>
            </div>

            <!-- Active Queue Section in Sidebar -->
            <div class="pt-3 space-y-2 flex-1">
                <div class="flex items-center justify-between px-3.5">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-cyan-400">Up Next Queue</span>
                    <span id="sidebar-queue-count" class="text-[11px] font-mono text-slate-400">0</span>
                </div>
                <div id="sidebar-queue-list" class="space-y-1.5 px-1 max-h-64 overflow-y-auto">
                    <!-- Queue items injected here -->
                </div>
            </div>
        </aside>

        <!-- Main Desktop Content Area -->
        <main class="flex-1 overflow-y-auto p-6 flex flex-col gap-6">

            <!-- Watch Page View (Hidden until video is played) -->
            <div id="watch-view" class="hidden grid grid-cols-1 xl:grid-cols-12 gap-6">
                
                <!-- Left Column: Video Stage & Metadata -->
                <div class="xl:col-span-8 flex flex-col gap-4">
                    <div class="glass-panel rounded-2xl overflow-hidden shadow-2xl border border-cyan-500/20 bg-black">
                        <div class="player-aspect">
                            <iframe 
                                id="yt-iframe"
                                src=""
                                title="YouTube Embedded Player"
                                referrerpolicy="strict-origin-when-cross-origin"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                allowfullscreen>
                            </iframe>
                        </div>
                    </div>

                    <!-- Video Metadata & Toolbar -->
                    <div class="glass-panel rounded-2xl p-5 space-y-4">
                        <h1 id="watch-title" class="text-lg sm:text-xl font-bold text-white leading-snug">Video Title</h1>
                        <div class="flex flex-wrap items-center justify-between gap-4 pb-3 border-b border-slate-800">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-gradient-to-r from-cyan-500 to-teal-500 flex items-center justify-center font-bold text-slate-950 text-sm" id="channel-avatar">
                                    C
                                </div>
                                <div>
                                    <h2 id="watch-channel" class="text-sm font-semibold text-slate-200">Channel Name</h2>
                                    <p id="watch-meta" class="text-xs text-slate-400">Views • Date</p>
                                </div>
                            </div>

                            <!-- Actions Toolbar -->
                            <div class="flex items-center gap-2">
                                <button onclick="toggleBookmarkActive()" id="watch-save-btn" class="px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center gap-1.5 transition-all">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
                                    <span id="watch-save-label">Save</span>
                                </button>
                                <button onclick="copyShareLink()" class="px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center gap-1.5 transition-all">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                                    <span>Share</span>
                                </button>
                                <button onclick="closeWatchView()" class="px-3.5 py-2 rounded-xl text-xs font-medium bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 border border-rose-500/30 transition-all">
                                    Back to Grid
                                </button>
                            </div>
                        </div>
                        <div class="bg-slate-900/80 rounded-xl p-3.5 text-xs text-slate-300 font-mono">
                            <span class="text-cyan-400 font-semibold">Video ID:</span> <span id="watch-id-display">---</span>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Queue & Related Sidebar -->
                <div class="xl:col-span-4 flex flex-col gap-4">
                    <div class="glass-panel rounded-2xl p-4 flex flex-col h-full max-h-[700px]">
                        <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                            <span class="text-xs font-bold uppercase tracking-wider text-cyan-400">Up Next / Queue</span>
                            <button onclick="playNextInQueue()" class="text-xs text-teal-400 hover:text-teal-300 font-medium">Play Next</button>
                        </div>
                        <div id="watch-queue-container" class="flex-1 overflow-y-auto py-3 space-y-2.5">
                            <!-- Queue items injected here -->
                        </div>
                    </div>
                </div>

            </div>

            <!-- Explore / Home Feed View -->
            <div id="explore-view" class="space-y-6">
                <!-- Category Chips Header -->
                <div class="flex items-center gap-2 overflow-x-auto pb-1">
                    <button data-cat="All" onclick="selectCategory('All')" class="cat-pill active shrink-0 px-4 py-1.5 rounded-full text-xs font-medium bg-cyan-500 text-slate-950 shadow-sm transition-all">All</button>
                    <button data-cat="Coding & CS" onclick="selectCategory('Coding & CS')" class="cat-pill shrink-0 px-4 py-1.5 rounded-full text-xs font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-700/80 transition-all">Coding & CS</button>
                    <button data-cat="Tech & Hardware" onclick="selectCategory('Tech & Hardware')" class="cat-pill shrink-0 px-4 py-1.5 rounded-full text-xs font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-700/80 transition-all">Tech & Hardware</button>
                    <button data-cat="Ambient Focus" onclick="selectCategory('Ambient Focus')" class="cat-pill shrink-0 px-4 py-1.5 rounded-full text-xs font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-700/80 transition-all">Ambient Focus</button>
                    <button data-cat="Science & Space" onclick="selectCategory('Science & Space')" class="cat-pill shrink-0 px-4 py-1.5 rounded-full text-xs font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-700/80 transition-all">Science & Space</button>
                    <button data-cat="Design & UI" onclick="selectCategory('Design & UI')" class="cat-pill shrink-0 px-4 py-1.5 rounded-full text-xs font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-700/80 transition-all">Design & UI</button>
                </div>

                <div class="flex items-center justify-between">
                    <h2 id="feed-heading" class="text-base font-bold text-white">Recommended Streams</h2>
                    <span id="source-indicator" class="text-[11px] font-mono px-2.5 py-0.5 rounded-full bg-slate-900 text-slate-300 border border-slate-700/80">Desktop Feed</span>
                </div>

                <!-- Desktop 4-Column Video Grid -->
                <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                    <!-- Cards injected here -->
                </div>
            </div>

            <!-- Saved Watch Later View -->
            <div id="library-view" class="hidden space-y-6">
                <div class="glass-panel rounded-2xl p-5 flex items-center justify-between">
                    <div>
                        <h2 class="text-lg font-bold text-white">Saved Watch Later Library</h2>
                        <p class="text-xs text-slate-400 mt-0.5">Persisted in local browser storage.</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="exportJSON()" class="px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700">Export JSON</button>
                        <button onclick="clearLibrary()" class="px-3.5 py-2 rounded-xl text-xs font-medium bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 border border-rose-500/30">Clear All</button>
                    </div>
                </div>
                <div id="saved-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                    <!-- Saved cards injected here -->
                </div>
            </div>

        </main>
    </div>

    <!-- Settings & API Configuration Modal -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-panel max-w-lg w-full rounded-2xl p-6 shadow-2xl border border-slate-700/80 space-y-5">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
                    <h3 class="text-base font-bold text-white">Desktop Client Settings</h3>
                </div>
                <button onclick="toggleModal('settings-modal', false)" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>

            <div class="space-y-4 text-sm">
                <div class="space-y-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Active Search Engine</label>
                    <div class="grid grid-cols-2 gap-2.5">
                        <button type="button" id="mode-public-btn" onclick="setSearchMode('public')" class="p-3 rounded-xl border text-left transition-all bg-cyan-500/15 border-cyan-500 text-white">
                            <div class="font-semibold text-xs text-cyan-300">Public Relay Chain</div>
                            <div class="text-[11px] text-slate-400 mt-0.5">Zero-key Piped & Invidious</div>
                        </button>
                        <button type="button" id="mode-youtube-btn" onclick="setSearchMode('youtube')" class="p-3 rounded-xl border text-left transition-all bg-slate-900 border-slate-700 text-slate-300">
                            <div class="font-semibold text-xs text-teal-300">YouTube Data API v3</div>
                            <div class="text-[11px] text-slate-400 mt-0.5">Official Google API Key</div>
                        </button>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="yt-api-key-input" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">YouTube API Key (Optional)</label>
                    <input 
                        type="password" 
                        id="yt-api-key-input" 
                        placeholder="AIzaSy..." 
                        class="w-full bg-slate-950 text-slate-100 text-xs font-mono rounded-xl px-3.5 py-2.5 border border-slate-700 focus:border-cyan-500 focus:outline-none"
                    >
                </div>
            </div>

            <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
                <button onclick="toggleModal('settings-modal', false)" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-300 hover:bg-slate-800">Cancel</button>
                <button onclick="saveSettings()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-gradient-to-r from-cyan-500 to-teal-500 text-slate-950 shadow-md">Save Settings</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * StreamSlate — Desktop YouTube Client
         */

        const STARTER_VIDEOS = [
            { id: 'jfKfPfyJRdk', title: 'lofi hip hop radio 📚 beats to relax/study to', channel: 'Lofi Girl', views: 'LIVE', uploaded: '24/7 Stream', duration: 'LIVE', category: 'Ambient Focus' },
            { id: '8mAITcNt710', title: 'Harvard CS50 (2023) – Full Computer Science University Course', channel: 'freeCodeCamp.org', views: '4.8M views', uploaded: '1 year ago', duration: '25:13:45', category: 'Coding & CS' },
            { id: 'PkZNo7MFNFg', title: 'Learn JavaScript - Full Course for Beginners', channel: 'freeCodeCamp.org', views: '18M views', uploaded: '5 years ago', duration: '3:26:42', category: 'Coding & CS' },
            { id: '5qap5aO4i9A', title: 'synthwave radio 🌌 beats to chill/game to', channel: 'Lofi Girl', views: 'LIVE', uploaded: '24/7 Stream', duration: 'LIVE', category: 'Ambient Focus' },
            { id: 'aircAruvnKk', title: 'But what is a neural network? | Deep learning chapter 1', channel: '3Blue1Brown', views: '17M views', uploaded: '6 years ago', duration: '19:13', category: 'Science & Space' },
            { id: 'Tn6-PIqc4UM', title: 'React in 100 Seconds', channel: 'Fireship', views: '1.4M views', uploaded: '3 years ago', duration: '2:18', category: 'Coding & CS' },
            { id: 'udFxKZRyQtE', title: 'The Largest Black Hole in the Universe - Size Comparison', channel: 'Kurzgesagt', views: '26M views', uploaded: '3 years ago', duration: '12:08', category: 'Science & Space' },
            { id: 'M5QY2_8704o', title: 'Chillstep Music for Programming / Cyber / Coding', channel: 'BLUME', views: '6.2M views', uploaded: '4 years ago', duration: '1:58:14', category: 'Ambient Focus' },
            { id: 'ysz5S6PUM-U', title: 'How Linux Works Under the Hood', channel: 'Tech Explained', views: '920K views', uploaded: '1 year ago', duration: '18:45', category: 'Tech & Hardware' },
            { id: '_uQrJ0TkZlc', title: 'Python Full Course for Beginners', channel: 'Programming with Mosh', views: '41M views', uploaded: '5 years ago', duration: '6:14:07', category: 'Coding & CS' },
            { id: 'c9Wg6Cb_YlU', title: 'UI / UX Design Tutorial – Wireframe, Mockup & Design in Figma', channel: 'freeCodeCamp.org', views: '3.9M views', uploaded: '3 years ago', duration: '1:38:22', category: 'Design & UI' },
            { id: 'kqtD5dpn9C8', title: 'Python for Beginners - Learn Python in 1 Hour', channel: 'Programming with Mosh', views: '19M views', uploaded: '3 years ago', duration: '1:00:05', category: 'Tech & Hardware' }
        ];

        const PUBLIC_RELAYS = [
            { type: 'piped', url: 'https://pipedapi.kavin.rocks' },
            { type: 'piped', url: 'https://pipedapi.adminforge.de' },
            { type: 'invidious', url: 'https://inv.nadeko.net' }
        ];

        let state = {
            currentVideos: [...STARTER_VIDEOS],
            savedVideos: JSON.parse(localStorage.getItem('streamslate_saved') || '[]'),
            queue: JSON.parse(localStorage.getItem('streamslate_queue') || '[]'),
            activeVideo: null,
            activeCategory: 'All',
            searchMode: localStorage.getItem('streamslate_search_mode') || 'public',
            ytApiKey: localStorage.getItem('streamslate_yt_api_key') || ''
        };

        document.addEventListener('DOMContentLoaded', () => {
            updateBadges();
            updateSettingsUI();
            renderVideoGrid(state.currentVideos);
            renderSidebarQueue();

            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search-btn');
            searchInput.addEventListener('input', () => {
                clearBtn.classList.toggle('hidden', searchInput.value.trim() === '');
            });

            document.getElementById('search-form').addEventListener('submit', (e) => {
                e.preventDefault();
                handleSearch(searchInput.value.trim());
            });
        });

        function extractYouTubeId(input) {
            if (!input) return null;
            const trimmed = input.trim();
            if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts|live)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = trimmed.match(regex);
            return match ? match[1] : null;
        }

        async function handleSearch(query) {
            if (!query) {
                navigateHome();
                return;
            }

            switchTab('explore');

            const directId = extractYouTubeId(query);
            if (directId) {
                const videoObj = { id: directId, title: `Direct Stream (${directId})`, channel: 'YouTube Desktop Player', views: 'Direct', duration: 'HD', category: 'Direct' };
                playVideo(videoObj);
                showToast(`Loaded ID: ${directId}`, 'success');
                return;
            }

            try {
                let results = [];
                if (state.searchMode === 'youtube' && state.ytApiKey) {
                    results = await searchViaAPI(query, state.ytApiKey);
                } else {
                    results = await searchViaRelays(query);
                }

                if (results.length > 0) {
                    state.currentVideos = results;
                    renderVideoGrid(results);
                } else {
                    throw new Error('No results');
                }
            } catch (err) {
                const fallback = STARTER_VIDEOS.filter(v => v.title.toLowerCase().includes(query.toLowerCase()) || v.channel.toLowerCase().includes(query.toLowerCase()));
                if (fallback.length > 0) {
                    renderVideoGrid(fallback);
                    showToast('Public relay rate-limited — showing matching library items.', 'info');
                } else {
                    showToast('Search limit reached. Try pasting a direct YouTube URL.', 'error');
                }
            }
        }

        async function searchViaRelays(query) {
            for (const relay of PUBLIC_RELAYS) {
                try {
                    const res = await fetch(`${relay.url}/search?q=${encodeURIComponent(query)}&filter=videos`);
                    if (!res.ok) continue;
                    const data = await res.json();
                    if (Array.isArray(data.items)) {
                        return data.items.filter(i => i.type === 'stream' && i.url).map(i => {
                            const idM = i.url.match(/v=([^&]+)/);
                            return idM ? { id: idM[1], title: i.title, channel: i.uploaderName, views: i.views ? `${(i.views/1000).toFixed(0)}K views` : 'YouTube', duration: 'HD', category: 'Search' } : null;
                        }).filter(Boolean);
                    }
                } catch (e) { continue; }
            }
            throw new Error('All relays failed');
        }

        async function searchViaAPI(query, key) {
            const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=16&q=${encodeURIComponent(query)}&key=${encodeURIComponent(key)}`);
            if (!res.ok) throw new Error('API Error');
            const data = await res.json();
            return (data.items || []).map(i => ({
                id: i.id.videoId,
                title: i.snippet.title,
                channel: i.snippet.channelTitle,
                views: 'API',
                duration: 'HD',
                category: 'API'
            }));
        }

        function playVideo(video) {
            state.activeVideo = video;
            const watchView = document.getElementById('watch-view');
            const exploreView = document.getElementById('explore-view');
            const libraryView = document.getElementById('library-view');
            
            exploreView.classList.add('hidden');
            libraryView.classList.add('hidden');
            watchView.classList.remove('hidden');

            const iframe = document.getElementById('yt-iframe');
            const safeOrigin = window.location.origin && window.location.origin !== 'null' ? window.location.origin : 'https://localhost';
            iframe.src = `https://www.youtube-nocookie.com/embed/${video.id}?autoplay=1&enablejsapi=1&origin=${encodeURIComponent(safeOrigin)}&rel=0&modestbranding=1`;

            document.getElementById('watch-title').textContent = video.title;
            document.getElementById('watch-channel').textContent = video.channel;
            document.getElementById('watch-meta').textContent = `${video.views || 'YouTube'} • ${video.uploaded || 'Stream'}`;
            document.getElementById('watch-id-display').textContent = video.id;
            document.getElementById('channel-avatar').textContent = video.channel ? video.channel[0].toUpperCase() : 'Y';

            updateWatchSaveButton();
            renderWatchQueue();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeWatchView() {
            document.getElementById('yt-iframe').src = '';
            document.getElementById('watch-view').classList.add('hidden');
            document.getElementById('explore-view').classList.remove('hidden');
        }

        function renderVideoGrid(videos) {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '';
            videos.forEach(video => {
                const isSaved = state.savedVideos.some(v => v.id === video.id);
                const card = document.createElement('article');
                card.className = 'group glass-panel rounded-2xl overflow-hidden flex flex-col justify-between hover:border-cyan-500/40 hover:-translate-y-0.5 transition-all shadow-lg shadow-black/30';
                card.innerHTML = `
                    <div>
                        <div class="relative aspect-video bg-slate-950 overflow-hidden cursor-pointer" onclick='playVideo(${JSON.stringify(video).replace(/'/g, "&#39;")})'>
                            <img src="https://i.ytimg.com/vi/${video.id}/hqdefault.jpg" alt="" loading="lazy" onerror="this.src='https://placehold.co/640x360/0F172A/06B6D4?text=StreamSlate';" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                            <span class="absolute bottom-2 right-2 bg-slate-950/90 text-slate-100 font-mono text-[11px] px-2 py-0.5 rounded border border-slate-700/70">${video.duration || 'HD'}</span>
                        </div>
                        <div class="p-3.5 space-y-1">
                            <h3 onclick='playVideo(${JSON.stringify(video).replace(/'/g, "&#39;")})' class="text-sm font-semibold text-slate-100 group-hover:text-cyan-300 line-clamp-2 cursor-pointer leading-snug">${video.title}</h3>
                            <p class="text-xs text-slate-400 font-medium truncate">${video.channel}</p>
                            <p class="text-[11px] text-slate-500">${video.views || ''}</p>
                        </div>
                    </div>
                    <div class="px-3.5 pb-3.5 pt-1 flex items-center gap-2">
                        <button onclick='addToQueue(${JSON.stringify(video).replace(/'/g, "&#39;")})' class="flex-1 py-1.5 px-2.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">+ Queue</button>
                        <button onclick='toggleSave(${JSON.stringify(video).replace(/'/g, "&#39;")})' class="py-1.5 px-3 rounded-lg text-xs font-medium border ${isSaved ? 'bg-cyan-500/20 border-cyan-500/50 text-cyan-300' : 'bg-slate-800 hover:bg-slate-700 border-slate-700 text-slate-300'}">${isSaved ? 'Saved' : 'Save'}</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function selectCategory(cat) {
            state.activeCategory = cat;
            document.querySelectorAll('.cat-pill').forEach(btn => {
                const match = btn.dataset.cat === cat;
                btn.className = match ? 'cat-pill active shrink-0 px-4 py-1.5 rounded-full text-xs font-medium bg-cyan-500 text-slate-950 shadow-sm transition-all' : 'cat-pill shrink-0 px-4 py-1.5 rounded-full text-xs font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-700/80 transition-all';
            });
            if (cat === 'All') {
                state.currentVideos = [...STARTER_VIDEOS];
                document.getElementById('feed-heading').textContent = 'Recommended Streams';
            } else {
                state.currentVideos = STARTER_VIDEOS.filter(v => v.category === cat);
                document.getElementById('feed-heading').textContent = cat;
            }
            renderVideoGrid(state.currentVideos);
        }

        function navigateHome() {
            clearSearchInput();
            selectCategory('All');
            switchTab('explore');
            closeWatchView();
        }

        function clearSearchInput() {
            document.getElementById('search-input').value = '';
            document.getElementById('clear-search-btn').classList.add('hidden');
        }

        function addToQueue(video) {
            if (!state.queue.some(v => v.id === video.id)) {
                state.queue.push(video);
                localStorage.setItem('streamslate_queue', JSON.stringify(state.queue));
                renderSidebarQueue();
                renderWatchQueue();
                showToast(`Added to Queue`, 'success');
            } else {
                showToast('Already in queue', 'info');
            }
        }

        function removeFromQueue(id) {
            state.queue = state.queue.filter(v => v.id !== id);
            localStorage.setItem('streamslate_queue', JSON.stringify(state.queue));
            renderSidebarQueue();
            renderWatchQueue();
        }

        function playNextInQueue() {
            if (state.queue.length === 0) {
                showToast('Queue is empty', 'info');
                return;
            }
            const next = state.queue.shift();
            localStorage.setItem('streamslate_queue', JSON.stringify(state.queue));
            renderSidebarQueue();
            playVideo(next);
        }

        function renderSidebarQueue() {
            const container = document.getElementById('sidebar-queue-list');
            document.getElementById('sidebar-queue-count').textContent = state.queue.length;
            if (state.queue.length === 0) {
                container.innerHTML = `<div class="px-3 py-2 text-[11px] text-slate-500">Queue is empty</div>`;
                return;
            }
            container.innerHTML = state.queue.map(v => `
                <div class="flex items-center gap-2 p-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 group cursor-pointer" onclick='playVideo(${JSON.stringify(v).replace(/'/g, "&#39;")})'>
                    <img src="https://i.ytimg.com/vi/${v.id}/default.jpg" class="w-14 h-9 object-cover rounded bg-slate-950">
                    <div class="flex-1 min-w-0">
                        <p class="text-[11px] font-medium text-slate-200 truncate group-hover:text-cyan-300">${v.title}</p>
                    </div>
                </div>
            `).join('');
        }

        function renderWatchQueue() {
            const container = document.getElementById('watch-queue-container');
            if (state.queue.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-xs text-slate-500">No videos in queue</div>`;
                return;
            }
            container.innerHTML = state.queue.map(v => `
                <div class="flex items-center gap-3 p-2 rounded-xl bg-slate-900/90 hover:bg-slate-800 group">
                    <img src="https://i.ytimg.com/vi/${v.id}/default.jpg" onclick='playVideo(${JSON.stringify(v).replace(/'/g, "&#39;")})' class="w-24 h-14 object-cover rounded-lg cursor-pointer bg-slate-950">
                    <div class="flex-1 min-w-0 cursor-pointer" onclick='playVideo(${JSON.stringify(v).replace(/'/g, "&#39;")})'>
                        <p class="text-xs font-medium text-slate-200 group-hover:text-cyan-300 truncate">${v.title}</p>
                        <p class="text-[11px] text-slate-400 truncate">${v.channel}</p>
                    </div>
                    <button onclick="removeFromQueue('${v.id}')" class="p-1 text-slate-500 hover:text-rose-400"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
                </div>
            `).join('');
        }

        function toggleSave(video) {
            const exists = state.savedVideos.some(v => v.id === video.id);
            if (exists) {
                state.savedVideos = state.savedVideos.filter(v => v.id !== video.id);
                showToast('Removed from Watch Later', 'info');
            } else {
                state.savedVideos.unshift(video);
                showToast('Saved to Watch Later', 'success');
            }
            localStorage.setItem('streamslate_saved', JSON.stringify(state.savedVideos));
            updateBadges();
            renderVideoGrid(state.currentVideos);
            renderSavedGrid();
            updateWatchSaveButton();
        }

        function toggleBookmarkActive() {
            if (state.activeVideo) toggleSave(state.activeVideo);
        }

        function updateWatchSaveButton() {
            if (!state.activeVideo) return;
            const isSaved = state.savedVideos.some(v => v.id === state.activeVideo.id);
            const btn = document.getElementById('watch-save-btn');
            const lbl = document.getElementById('watch-save-label');
            if (isSaved) {
                btn.className = 'px-3.5 py-2 rounded-xl text-xs font-medium bg-cyan-500/20 border border-cyan-500/50 text-cyan-300 flex items-center gap-1.5';
                lbl.textContent = 'Saved';
            } else {
                btn.className = 'px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center gap-1.5';
                lbl.textContent = 'Save';
            }
        }

        function updateBadges() {
            document.getElementById('saved-count-sidebar').textContent = state.savedVideos.length;
        }

        function renderSavedGrid() {
            const grid = document.getElementById('saved-grid');
            if (state.savedVideos.length === 0) {
                grid.innerHTML = `<div class="col-span-full glass-panel rounded-2xl p-10 text-center text-xs text-slate-500">No saved videos in Watch Later</div>`;
                return;
            }
            grid.innerHTML = state.savedVideos.map(v => `
                <article class="glass-panel rounded-2xl overflow-hidden flex flex-col justify-between">
                    <div>
                        <div class="relative aspect-video bg-slate-950 overflow-hidden cursor-pointer" onclick='playVideo(${JSON.stringify(v).replace(/'/g, "&#39;")})'>
                            <img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" class="w-full h-full object-cover">
                        </div>
                        <div class="p-3.5 space-y-1">
                            <h3 onclick='playVideo(${JSON.stringify(v).replace(/'/g, "&#39;")})' class="text-sm font-semibold text-slate-100 hover:text-cyan-300 line-clamp-2 cursor-pointer">${v.title}</h3>
                            <p class="text-xs text-slate-400">${v.channel}</p>
                        </div>
                    </div>
                    <div class="px-3.5 pb-3.5">
                        <button onclick='toggleSave(${JSON.stringify(v).replace(/'/g, "&#39;")})' class="w-full py-1.5 rounded-lg text-xs font-medium bg-rose-500/15 text-rose-300">Remove</button>
                    </div>
                </article>
            `).join('');
        }

        function switchTab(tab) {
            const explore = document.getElementById('explore-view');
            const library = document.getElementById('library-view');
            const watch = document.getElementById('watch-view');
            const homeBtn = document.getElementById('sidebar-home');
            const libBtn = document.getElementById('sidebar-library');

            watch.classList.add('hidden');
            if (tab === 'explore') {
                explore.classList.remove('hidden');
                library.classList.add('hidden');
                homeBtn.classList.add('active');
                libBtn.classList.remove('active');
            } else {
                explore.classList.add('hidden');
                library.classList.remove('hidden');
                libBtn.classList.add('active');
                homeBtn.classList.remove('active');
                renderSavedGrid();
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('desktop-sidebar');
            sidebar.classList.toggle('hidden');
        }

        function toggleModal(id, show) {
            document.getElementById(id).classList.toggle('hidden', !show);
        }

        function setSearchMode(mode) {
            state.searchMode = mode;
            updateSettingsUI();
        }

        function updateSettingsUI() {
            document.getElementById('yt-api-key-input').value = state.ytApiKey;
            const pubBtn = document.getElementById('mode-public-btn');
            const ytBtn = document.getElementById('mode-youtube-btn');
            if (state.searchMode === 'youtube') {
                ytBtn.className = 'p-3 rounded-xl border text-left bg-teal-500/15 border-teal-500 text-white';
                pubBtn.className = 'p-3 rounded-xl border text-left bg-slate-900 border-slate-700 text-slate-300';
            } else {
                pubBtn.className = 'p-3 rounded-xl border text-left bg-cyan-500/15 border-cyan-500 text-white';
                ytBtn.className = 'p-3 rounded-xl border text-left bg-slate-900 border-slate-700 text-slate-300';
            }
        }

        function saveSettings() {
            state.ytApiKey = document.getElementById('yt-api-key-input').value.trim();
            localStorage.setItem('streamslate_search_mode', state.searchMode);
            localStorage.setItem('streamslate_yt_api_key', state.ytApiKey);
            toggleModal('settings-modal', false);
            showToast('Settings saved', 'success');
        }

        function copyShareLink() {
            if (!state.activeVideo) return;
            const url = `https://youtu.be/${state.activeVideo.id}`;
            const temp = document.createElement('input');
            temp.value = url;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            showToast(`Copied: ${url}`, 'success');
        }

        function exportJSON() {
            const blob = new Blob([JSON.stringify({ saved: state.savedVideos, queue: state.queue }, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'streamslate-export.json';
            a.click();
            showToast('Exported successfully', 'success');
        }

        function clearLibrary() {
            state.savedVideos = [];
            localStorage.setItem('streamslate_saved', '[]');
            updateBadges();
            renderSavedGrid();
            renderVideoGrid(state.currentVideos);
            showToast('Library cleared', 'info');
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const border = type === 'success' ? 'border-teal-500/50 text-teal-200' : type === 'error' ? 'border-rose-500/50 text-rose-200' : 'border-cyan-500/50 text-cyan-200';
            toast.className = `glass-panel px-4 py-3 rounded-xl shadow-xl border ${border} text-xs font-medium`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }
    </script>
</body>
</html>
