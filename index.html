<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YT</title>

    <!-- PWA & Standalone Web App Metadata -->
    <meta name="application-name" content="YT">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YT">

    <!-- Authentic YouTube-style Rounded Red Play-Button Favicon & Touch Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='12' width='56' height='40' rx='12' fill='%23ff0000'/%3E%3Cpolygon points='26,22 26,42 44,32' fill='%23ffffff'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f0f0f'/%3E%3Crect x='8' y='15' width='48' height='34' rx='10' fill='%23ff0000'/%3E%3Cpolygon points='27,23.5 27,40.5 42,32' fill='%23ffffff'/%3E%3C/svg%3E">

    <!-- Embedded Web App Manifest for Standalone PWA Installation -->
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22YT%22%2C%22short_name%22%3A%22YT%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f0f0f%22%2C%22theme_color%22%3A%22%230f0f0f%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%2520viewBox%3D%270%25200%252064%252064%27%253E%253Crect%2520x%3D%274%27%2520y%3D%2712%27%2520width%3D%2756%27%2520height%3D%2740%27%2520rx%3D%2712%27%2520fill%3D%27%2523ff0000%27%2F%253E%253Cpolygon%2520points%3D%2726%2C22%252026%2C42%252044%2C32%27%2520fill%3D%27%2523ffffff%27%2F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">

    <!-- Immediate Automatic Redirection -->
    <script>
        window.location.replace("https://www.youtube.com/?app=desktop");
    </script>
    <meta http-equiv="refresh" content="0; url=https://www.youtube.com/?app=desktop">

    <!-- Load Tailwind CSS & Inter Font for Minimalist Fallback Screen -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#0f0f0f] text-zinc-100 font-sans h-screen w-screen overflow-hidden flex flex-col items-center justify-center p-6 select-none">

    <!-- Minimalist Loading & Fallback Container -->
    <main class="flex flex-col items-center text-center max-w-xs w-full space-y-6">
        <!-- YouTube-style App Icon & Subtle Spinner -->
        <div class="relative flex items-center justify-center p-2">
            <div class="w-20 h-14 rounded-2xl bg-[#ff0000] flex items-center justify-center shadow-lg shadow-red-600/25">
                <svg class="w-8 h-8 text-white fill-current ml-0.5" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </div>
            <!-- Subtle Circular Loading Ring -->
            <div class="absolute -inset-1.5 rounded-3xl border-2 border-zinc-800 border-t-red-500 animate-spin" aria-hidden="true"></div>
        </div>

        <!-- Status Text -->
        <div class="space-y-1">
            <h1 class="text-lg font-semibold tracking-tight text-white">YT</h1>
            <p class="text-xs text-zinc-400">Opening YouTube Desktop...</p>
        </div>

        <!-- Manual Fallback Link (in case redirect is delayed or blocked) -->
        <a href="https://www.youtube.com/?app=desktop"
           rel="noopener noreferrer"
           class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-xs font-medium text-zinc-300 hover:text-white transition-colors">
            <span>Continue to YouTube</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
        </a>
    </main>

</body>
</html>
